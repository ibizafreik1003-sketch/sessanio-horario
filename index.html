<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--td:#3D7A6E;--tb:#EAF5F3;--tl:#8ECDC4;--go:#D4891A;--gl:#E8A030;--bg:#F4F8F7;--wh:#fff;--tx:#1A2E2A;--mu:#5A7A74;--da:#C0392B;--dl:#FDECEA;--rd:10px;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;}
nav{background:var(--td);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.lw{display:flex;align-items:center;gap:10px;}
.logo{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--td);font-size:.95rem;}
.brand{color:#fff;font-size:.92rem;font-weight:800;}
.brands{color:rgba(255,255,255,.55);font-size:.58rem;letter-spacing:1px;text-transform:uppercase;}
.sdot{width:8px;height:8px;border-radius:50%;background:#E8A030;margin-left:6px;display:inline-block;transition:.3s;}
#clk{color:rgba(255,255,255,.55);font-size:.63rem;}
.tabs{background:var(--td);display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.1);}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:72px;padding:9px 4px;text-align:center;font-size:.6rem;color:rgba(255,255,255,.4);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:600;}
.tab.on{color:#fff;border-bottom-color:var(--gl);}
.view{display:none;padding:12px;padding-bottom:40px;}.view.on{display:block;}
.card{background:var(--wh);border-radius:var(--rd);padding:14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,60,50,.09);}
.sr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.st{background:var(--td);border-radius:10px;padding:12px;color:#fff;}
.st.go{background:linear-gradient(135deg,var(--go),#A86A0E);}
.st .n{font-size:1.5rem;font-weight:800;color:rgba(255,255,255,.9);line-height:1;}
.st.go .n{color:#fff;}
.st .l{font-size:.56rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.wknav{display:flex;align-items:center;gap:8px;background:#fff;border-radius:var(--rd);padding:10px 14px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,60,50,.09);}
.wknav button{background:var(--tb);border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--td);font-size:.9rem;font-weight:700;}
.wklbl{flex:1;text-align:center;font-size:.76rem;font-weight:700;}
.wkn{font-size:.62rem;color:var(--mu);}
.sw{overflow-x:auto;border-radius:var(--rd);box-shadow:0 2px 12px rgba(0,60,50,.09);}
.st2{border-collapse:collapse;width:100%;min-width:520px;background:#fff;}
.st2 th{background:var(--td);color:#fff;padding:7px 5px;font-size:.61rem;font-weight:700;text-align:center;white-space:nowrap;}
.st2 th.ec{text-align:left;min-width:100px;padding-left:9px;}
.st2 td{padding:4px 2px;border-bottom:1px solid var(--tb);vertical-align:top;}
.st2 td.ecc{padding:7px 9px;}
.enm{font-size:.74rem;font-weight:700;}
.ero{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;}
.rt{font-size:.55rem;padding:1px 5px;border-radius:10px;font-weight:600;}
.rm{background:#D4EDDA;color:#155724;}.rb{background:#CCE5FF;color:#004085;}.rc2{background:#FFF3CD;color:#856404;}.rco{background:#F3E5F5;color:#4A148C;}.ra{background:#E2E3E5;color:#383d41;}
.eh{font-size:.58rem;color:var(--mu);margin-top:2px;}
.st2 tr:nth-child(even) td{background:#FAFEFE;}.st2 tr:hover td{background:var(--tb);}
.sc{text-align:center;cursor:pointer;padding:3px 2px;}
.sp{display:inline-block;padding:3px 5px;border-radius:6px;font-size:.58rem;font-weight:600;white-space:nowrap;min-width:65px;}
.spm{background:#FFF3CC;color:#7A5800;}.spt{background:var(--tb);color:var(--td);}.spd{background:#EBEBEB;color:#777;}.spx{background:transparent;color:var(--td);border:1.5px dashed var(--tl);font-size:.56rem;}
.sh2{display:block;font-size:.55rem;color:var(--mu);margin-top:1px;}
.picker{position:fixed;inset:0;background:rgba(0,40,30,.55);z-index:200;display:none;align-items:flex-end;}.picker.on{display:flex;}
.pbox{background:#fff;border-radius:20px 20px 0 0;padding:16px 14px 30px;width:100%;max-height:78vh;overflow-y:auto;}
.popts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
.popt{padding:10px 6px;border-radius:10px;border:1.5px solid var(--tb);font-size:.74rem;text-align:center;cursor:pointer;background:#fff;}
.popt.sel{background:var(--td);color:#fff;border-color:var(--td);font-weight:700;}
.pcust{display:grid;grid-template-columns:1fr auto 1fr auto;gap:5px;align-items:center;margin-top:7px;}
.fi{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--tb);background:#fff;font-size:.82rem;color:var(--tx);}
.fi:focus{outline:none;border-color:var(--td);}select.fi{cursor:pointer;}
label{display:block;font-size:.71rem;font-weight:700;color:var(--tx);margin-bottom:3px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:9px 13px;border-radius:9px;font-size:.76rem;font-weight:700;border:none;cursor:pointer;}
.bp{background:var(--td);color:#fff;width:100%;}
.bo{background:transparent;color:var(--td);border:2px solid var(--td);}
.br{background:var(--dl);color:var(--da);border:1.5px solid #f0b0a8;width:100%;}
.bs{background:var(--tb);color:var(--td);}
.bg2{background:var(--go);color:#fff;}
.mc{background:var(--tb);border:none;border-radius:50%;width:28px;height:28px;font-size:1rem;cursor:pointer;color:var(--td);}
.mo{position:fixed;inset:0;background:rgba(0,40,30,.55);display:none;align-items:flex-end;z-index:200;}.mo.on{display:flex;}
.mbox{background:#fff;border-radius:20px 20px 0 0;padding:16px 14px 34px;width:100%;max-height:90vh;overflow-y:auto;}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}.mh h3{font-size:.92rem;font-weight:800;}
.nr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--tb);}.nr:last-child{border:none;}
.nl{font-size:.76rem;font-weight:600;}.nv{font-size:.8rem;font-weight:800;color:var(--td);}.ns{font-size:.63rem;color:var(--mu);}
.ntot{background:var(--td);border-radius:10px;padding:12px;color:#fff;margin-top:8px;display:flex;justify-content:space-between;align-items:center;}.ntot .t{font-size:1.1rem;font-weight:800;}
.nov{background:#FFF8E1;border-left:3px solid var(--go);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:.73rem;color:#6B4A00;}
.badge{padding:2px 8px;border-radius:20px;font-size:.63rem;font-weight:600;}.bok{background:#D4EDDA;color:#155724;}.bpnd{background:#FFF3CD;color:#856404;}
.cfm{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}.cfm.on{display:flex;}
.cbox{background:#fff;border-radius:16px;padding:22px 18px;width:100%;max-width:320px;text-align:center;}.cbox h4{font-size:.92rem;font-weight:800;margin-bottom:8px;}.cbox p{font-size:.78rem;color:var(--mu);margin-bottom:18px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--td);color:#fff;padding:10px 20px;border-radius:24px;font-size:.76rem;white-space:nowrap;transition:.3s;z-index:400;opacity:0;font-weight:600;}.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}
.erow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--tb);}.erow:last-child{border:none;}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;}
.ordb{display:flex;flex-direction:column;gap:2px;margin-right:4px;}
.ordbt{background:var(--tb);border:none;border-radius:4px;width:22px;height:22px;cursor:pointer;color:var(--td);font-size:.7rem;}
.ordbt:disabled{opacity:.3;cursor:default;}
</style>
</head>

    <div class="logo">S</div>

<div class="picker" id="picker">
  <div class="pbox">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 id="ptitle" style="font-size:.92rem;font-weight:800;">Asignar turno</h3>

<div class="mo" id="mo-emp">

    <label>Nombre *</label><input class="fi" id="efname" placeholder="Nombre completo" style="margin-bottom:8px;">
    <label>Roles</label>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;" id="rbtns">
      <button class="rt rm role-btn" data-r="Mesera" style="cursor:pointer;padding:5px 10px;border:2px solid transparent;">Mesero/a</button>
      <button class="rt rb role-btn" data-r="Barista" style="cursor:pointer;padding:5px 10px;border:2px solid transparent;">Barista</button>

    <button class="btn bp" id="save-emp-btn" style="margin-bottom:8px;">💾 Guardar</button>
    <button class="btn br" id="del-emp-btn" style="display:none;">🗑 Eliminar colaborador</button>

</div>

<div class="mo" id="mo-nom">
  <div class="mbox">
    <div class="mh"><h3 id="nomtitle">💰</h3><button class="mc" id="close-mo-nom">✕</button></div>
    <div id="nombody"></div>
  </div>
</div>

<div class="mo" id="mo-copy">
  <div class="mbox">
    <div class="mh"><h3>📋 Copiar semana</h3><button class="mc" id="close-mo-copy">✕</button></div>
    <div style="font-size:.78rem;color:var(--mu);margin-bottom:12px;">Copia el horario de la semana actual a otra semana.</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;">
      <button class="btn bs" id="copy-wk-minus" style="width:auto;padding:8px 12px;">−</button>

      </div>

<div class="cfm" id="cfm">

    <div style="font-size:2rem;margin-bottom:8px;">⚠️</div>

    </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── FIREBASE INIT ──
firebase.initializeApp({
  apiKey:"AIzaSyCny4LH_Jn98S7_Fu414HBqiTqZl5wYWIc",
  authDomain:"horarios-sessanio-v7.firebaseapp.com",
  projectId:"horarios-sessanio-v7",
  storageBucket:"horarios-sessanio-v7.firebasestorage.app",
  messagingSenderId:"784759066547",
  appId:"1:784759066547:web:472931d61c076a03e9c5c6"
});
const db = firebase.firestore();

// ── CONSTANTS ──
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const COLORS=['#3D7A6E','#D4891A','#2A6EA6','#7C4A9F','#C0392B','#1A8A8A','#A06020','#3A6A9F','#8A3A5C','#5A5A9F','#8A6A30','#4A6B8F'];
const RCSS={Mesera:'rm',Barista:'rb',Cajera:'rc2',Cocinera:'rco',Aux:'ra'};
const RLBL={Mesera:'Mesero/a',Barista:'Barista',Cajera:'Cajero/a',Cocinera:'Cocina',Aux:'Aux.'};
const PS=[{v:'DESCANSO',l:'💤 Descanso'},{v:'8:00-14:00',l:'🌅 Mañana (8-2)'},{v:'14:00-20:00',l:'🌙 Tarde (2-8)'},{v:'8:00-20:00',l:'⏰ Completo'},{v:'16:30-20:00',l:'🌆 Tarde corta'},{v:'9:00-15:00',l:'☀️ Mediodía'},{v:'-',l:'— Sin asignar'}];
const SMMLV=1300000,AUX_T=162000;
const DEFAULT_E=[
  {id:'1',name:'Sisley',roles:['Mesera'],tipo:'fijo',sal:1300000,vh:6000,pref:'Mañana',color:'#3D7A6E',notes:'',order:0},
  {id:'2',name:'Yorgelis',roles:['Mesera'],tipo:'fijo',sal:1300000,vh:6000,pref:'Tarde',color:'#D4891A',notes:'',order:1},
  {id:'3',name:'Martha',roles:['Cajera'],tipo:'fijo',sal:1300000,vh:6000,pref:'Tarde',color:'#2A6EA6',notes:'',order:2},
  {id:'4',name:'Tatiana',roles:['Barista'],tipo:'fijo',sal:1400000,vh:6000,pref:'Mañana',color:'#7C4A9F',notes:'',order:3},
  {id:'5',name:'Daniela',roles:['Cocinera'],tipo:'fijo',sal:1500000,vh:6000,pref:'Mañana',color:'#A06020',notes:'',order:4},
  {id:'6',name:'Alejandro',roles:['Aux'],tipo:'hora',sal:1200000,vh:5500,pref:'Flexible',color:'#8A6A30',notes:'',order:5},
];

// ── STATE ──
let E=[...DEFAULT_E];
let schedules={};
let wk=0,curTab=0,delId=null,pCtx=null,selR=[],copyWkOff=1,undoStack={};

// ── UTILS ──
const $=id=>document.getElementById(id);
const toast=msg=>{const t=$('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);};
const tick=()=>$('clk').textContent=new Date().toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});
const om=id=>$(id).classList.add('on');
const cm=id=>$(id).classList.remove('on');
const f$=n=>'$'+Math.round(n).toLocaleString('es-CO');
const sortedE=()=>[...E].sort((a,b)=>(a.order||0)-(b.order||0));
const sd=c=>$('sdot').style.background=c;

function wkKey(off=0){
  const n=new Date();n.setDate(n.getDate()+(wk+off)*7);
  const d=n.getDay(),m=new Date(n);m.setDate(n.getDate()-(d===0?6:d-1));
  return m.toISOString().slice(0,10);
}
function curSch(){
  const k=wkKey();
  if(!schedules[k]){schedules[k]={};E.forEach(e=>{schedules[k][e.name]=Array(7).fill('-');});}
  E.forEach(e=>{if(!schedules[k][e.name])schedules[k][e.name]=Array(7).fill('-');});
  return schedules[k];
}
function pt(t){if(!t)return null;t=t.trim();const m=t.match(/(\d+):(\d+)/);if(!m)return null;return+m[1]+(+m[2])/60;}
function ch(s){if(!s||s==='-'||s==='DESCANSO')return 0;const p=s.split('-');if(p.length<2)return 0;const a=pt(p[0]),b=pt(p[1]);return(!a||!b||b<=a)?0:b-a;}
function sc(s){if(!s||s==='-')return'spx';if(s==='DESCANSO')return'spd';const h=pt(s.split('-')[0]);return h===null?'spx':h<12?'spm':'spt';}
function sl(s){if(!s||s==='-')return'+ Asignar';if(s==='DESCANSO')return'💤 Descanso';return s.replace('-',' – ');}
function wlabel(off=0){
  const n=new Date();n.setDate(n.getDate()+(wk+off)*7);
  const d=n.getDay(),m=new Date(n);m.setDate(n.getDate()-(d===0?6:d-1));
  const sv=new Date(m);sv.setDate(m.getDate()+6);
  return m.toLocaleDateString('es-CO',{day:'numeric',month:'short'})+' — '+sv.toLocaleDateString('es-CO',{day:'numeric',month:'short'})+', '+sv.getFullYear();
}
function wnum(){
  const n=new Date();n.setDate(n.getDate()+wk*7);
  const s=new Date(n.getFullYear(),0,1);
  return'Sem: '+n.getFullYear()+'-S'+Math.ceil(((n-s)/86400000+s.getDay()+1)/7);
}
function toggleTipo(){
  const t=$('eftipo').value;
  $('efsal-w').style.display=t==='fijo'?'block':'none';
  $('efvh-w').style.display=t==='hora'?'block':'none';
}

// ── FIREBASE OPS ──
function fbSaveEmp(emp){
  sd('#E8A030');
  db.collection('employees').doc(String(emp.id)).set(emp)
    .then(()=>sd('#4CAF50')).catch(e=>{sd('#C0392B');console.warn(e);});
}
function fbDelEmp(id){
  db.collection('employees').doc(String(id)).delete()
    .then(()=>sd('#4CAF50')).catch(e=>console.warn(e));
}
function fbSaveSch(wkk){
  sd('#E8A030');
  db.collection('weeks').doc(wkk).set({data:schedules[wkk]||{}})
    .then(()=>sd('#4CAF50')).catch(e=>{sd('#C0392B');console.warn(e);});
}

// ── FIREBASE LOAD ──
function fbInit(){
  sd('#E8A030');
  db.collection('employees').get().then(snap=>{
    if(!snap.empty){
      E=snap.docs.map(d=>({id:d.id,...d.data()}));
      E.forEach((e,i)=>{if(e.order===undefined)e.order=i;});
    } else {
      DEFAULT_E.forEach(e=>fbSaveEmp(e));
    }
    return db.collection('weeks').get();
  }).then(snap=>{
    snap.forEach(d=>{schedules[d.id]=d.data().data||{};});
    // realtime
    db.collection('employees').onSnapshot(sn=>{
      E=sn.docs.map(d=>({id:d.id,...d.data()}));
      E.forEach((e,i)=>{if(e.order===undefined)e.order=i;});
      rc();
    });
    db.collection('weeks').onSnapshot(sn=>{
      sn.forEach(d=>{schedules[d.id]=d.data().data||{};});
      rc();
    });
    sd('#4CAF50');
    gv(0);
  }).catch(err=>{
    console.warn('Firebase error:',err);
    sd('#C0392B');
    gv(0);
  });
}

// ── NAV ──
function gv(i){

// ── HORARIOS ──
function rH(){
  const sch=curSch();const se=sortedE();
  const n=new Date();n.setDate(n.getDate()+wk*7);const d=n.getDay(),mon=new Date(n);mon.setDate(n.getDate()-(d===0?6:d-1));
  let th=`<tr><th class="ec">Empleado</th>`;
  for(let i=0;i<7;i++){const dd=new Date(mon);dd.setDate(mon.getDate()+i);th+=`<th>${DS[i]}<br><span style="font-weight:400;font-size:.54rem;opacity:.7;">${dd.getDate()} ${dd.toLocaleDateString('es-CO',{month:'short'}).replace('.','')} </span></th>`;}
  th+='</tr>';
  let tb='';
  se.forEach(emp=>{
    const sh=sch[emp.name]||Array(7).fill('-');let tot=0;sh.forEach(s=>tot+=ch(s));
    const rh=(emp.roles||[]).map(r=>`<span class="rt ${RCSS[r]||'ra'}">${RLBL[r]||r}</span>`).join(' ');
    tb+=`<tr><td class="ecc"><div class="enm">${emp.name}</div><div class="ero">${rh}</div><div class="eh">⏱ ${tot.toFixed(0)}h</div></td>`;
    sh.forEach((s,i)=>{const hrs=ch(s),empty=!s||s==='-';
      tb+=`<td class="sc" data-emp="${emp.id}" data-day="${i}"><span class="sp ${empty?'spx':sc(s)}">${sl(s)}</span>${hrs>0?`<span class="sh2">⏱ ${hrs}h</span>`:''}</td>`;
    });tb+='</tr>';
  });
  const hasUndo=!!undoStack[wkKey()];
  $('v1').innerHTML=`
  <div class="wknav">
    <button id="wk-prev">◀</button>
    <div class="wklbl">${wlabel()}<br><span class="wkn">${wnum()}</span></div>
    <button id="wk-next">▶</button>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
    <button class="btn bp" id="auto-gen-btn" style="flex:1;">✨ Auto-generar</button>
    <button class="btn bs" id="copy-week-btn" style="flex:1;">📋 Copiar semana</button>
    <button class="btn bg2" id="print-btn" style="flex:1;">🖨️ Imprimir</button>
  </div>
  ${hasUndo?`<button class="btn bo" id="undo-btn" style="width:100%;margin-bottom:10px;">↩ Deshacer</button>`:''}
  <div class="sw"><table class="st2"><thead>${th}</thead><tbody>${tb}</tbody></table></div>
  <div style="font-size:.68rem;color:var(--mu);margin-top:8px;padding:8px;background:#fff;border-radius:8px;">💡 Toca una celda para editar · Cambios guardados automáticamente</div>`;
  $('wk-prev').addEventListener('click',()=>{wk--;rH();});
  $('wk-next').addEventListener('click',()=>{wk++;rH();});
  $('auto-gen-btn').addEventListener('click',autoGen);
  $('copy-week-btn').addEventListener('click',openCopy);
  $('print-btn').addEventListener('click',printH);
  if(hasUndo)$('undo-btn').addEventListener('click',undoGen);
  document.querySelectorAll('.sc').forEach(td=>td.addEventListener('click',()=>openPicker(td.dataset.emp,+td.dataset.day)));
}

// ── PICKER ──
function openPicker(eid,di){
  pCtx={eid,di};const emp=E.find(e=>e.id===eid);if(!emp)return;
  const cur=(curSch()[emp.name]||[])[di]||'-';
  $('ptitle').textContent=emp.name+' — '+DAYS[di];
  $('popts').innerHTML=PS.map(o=>`<div class="popt${o.v===cur?' sel':''}" data-val="${o.v}">${o.l}</div>`).join('');
  document.querySelectorAll('.popt').forEach(el=>el.addEventListener('click',()=>{
    document.querySelectorAll('.popt').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');applyShift(el.dataset.val);
  }));
  om('picker');
}
function applyShift(val){
  if(!pCtx)return;const emp=E.find(e=>e.id===pCtx.eid);if(!emp)return;
  const sch=curSch();const k=wkKey();
  if(!sch[emp.name])sch[emp.name]=Array(7).fill('-');
  if(!undoStack[k])undoStack[k]=JSON.parse(JSON.stringify(sch));
  sch[emp.name][pCtx.di]=val;
  cm('picker');fbSaveSch(k);rH();
  toast('✅ '+emp.name+' — '+DAYS[pCtx.di]+': '+sl(val));
}
function undoGen(){
  const k=wkKey();if(!undoStack[k]){toast('⚠️ No hay cambio para deshacer');return;}
  schedules[k]=JSON.parse(JSON.stringify(undoStack[k]));
  delete undoStack[k];fbSaveSch(k);rH();toast('↩ Horario restaurado');
}
function autoGen(){
  const k=wkKey();const sch=curSch();
  undoStack[k]=JSON.parse(JSON.stringify(sch));
  const GS=['8:00-14:00','8:00-14:00','14:00-20:00','14:00-20:00','16:30-20:00','9:00-15:00'];
  E.forEach(emp=>{
    const txt=(emp.notes||'').toLowerCase();
    const noM=/(no.*mañana|solo.*tarde)/i.test(txt),noT=/(solo.*mañana|no.*tarde)/i.test(txt);
    const noMTJ=/(no.*lun.*jue)/i.test(txt),red=/(1 turno)/i.test(txt);
    const rest=noMTJ?[0,1,2,3]:[Math.floor(Math.random()*7)];
    sch[emp.name]=DAYS.map((_,i)=>{
      if(red&&i>0)return'DESCANSO';if(rest.includes(i))return'DESCANSO';
      let pool=[...GS];
      if(noM)pool=pool.filter(s=>pt(s.split('-')[0])>=12);
      if(noT)pool=pool.filter(s=>pt(s.split('-')[0])<12);
      if(!pool.length)pool=GS;
      if(emp.pref==='Mañana'){const mp=pool.filter(s=>pt(s.split('-')[0])<12);if(mp.length)pool=[...mp,...pool];}
      if(emp.pref==='Tarde'){const tp=pool.filter(s=>pt(s.split('-')[0])>=12);if(tp.length)pool=[...tp,...pool];}
      return pool[Math.floor(Math.random()*pool.length)];
    });
  });
  fbSaveSch(k);rH();toast('✨ Horario generado');
}

// ── NÓMINA ──
function cn(emp){
  const sh=curSch()[emp.name]||[];let hO=0,hX=0,hD=0;
  sh.forEach((s,i)=>{const h=ch(s);if(i>=5)hD+=h;else{if(h>8)hX+=(h-8);hO+=Math.min(h,8);}});
  const tipo=emp.tipo||'fijo';let vH,base;
  if(tipo==='hora'){vH=emp.vh||6000;base=hO*vH;}
  else{const sal=emp.sal||SMMLV;vH=sal/240;base=Math.min(hO/48*sal,sal);}
  const ext=hX*vH*1.25,dom=hD*vH*1.75,bruto=base+ext+dom+AUX_T,s4=bruto*.04,p4=bruto*.04,neto=bruto-s4-p4;
  return{hO:hO.toFixed(1),hX:hX.toFixed(1),hD:hD.toFixed(1),base,ext,dom,bruto,s4,p4,neto,vH,tipo};
}
function rN(){
  const se=sortedE();let total=0;
  const rows=se.map(emp=>{const n=cn(emp);total+=n.neto;
    return`<div class="nr"><div><div class="nl">${emp.name}</div><div class="ns">${n.hO}h ord · ${n.hX}h ext · ${n.hD}h dom</div></div>
    <div style="text-align:right;"><div class="nv">${f$(n.neto)}</div>
    <button class="btn bs nom-det-btn" data-id="${emp.id}" style="padding:3px 9px;font-size:.62rem;width:auto;margin-top:3px;">Detalle</button></div></div>`;

  <div class="ntot"><span style="font-size:.78rem;opacity:.8;">Total neto a pagar</span><span class="t">${f$(total)}</span></div></div>

  <div style="font-size:.66rem;color:var(--mu);margin-top:4px;">H. extra +25% · Dom/festivo +75% · Aux. transporte ${f$(AUX_T)}/mes</div></div>`;

// ── NOVEDADES ──
function rNov(){
  const sch=curSch();const se=sortedE();const novs=[];
  se.forEach(emp=>{const sh=sch[emp.name]||[];let tot=0;sh.forEach(s=>tot+=ch(s));
    if(tot>48)novs.push('⚠️ <b>'+emp.name+'</b> supera 48h ('+tot.toFixed(0)+'h)');
    if(tot===0)novs.push('📋 <b>'+emp.name+'</b> sin turnos asignados');
    if(!sh.includes('DESCANSO'))novs.push('😴 <b>'+emp.name+'</b> sin día de descanso');
  });
  DAYS.forEach((day,i)=>{
    const w=se.filter(emp=>{const s=(sch[emp.name]||[])[i];return s&&s!=='-'&&s!=='DESCANSO';});
    if(w.length<2)novs.push('👥 <b>'+day+'</b>: solo '+w.length+' persona asignada');
    if(!w.some(e=>(e.roles||[]).includes('Barista')))novs.push('☕ <b>'+day+'</b>: sin barista');
    if(!w.some(e=>(e.roles||[]).includes('Cocinera')))novs.push('🍳 <b>'+day+'</b>: sin cocinero/a');
  });
  let tot=0;se.forEach(e=>{(sch[e.name]||[]).forEach(s=>tot+=ch(s));});
  $('v3').innerHTML=`<div class="sr"><div class="st"><div class="n">${novs.length}</div><div class="l">Novedades</div></div><div class="st go"><div class="n">${Math.round(tot)}</div><div class="l">Horas totales</div></div></div>
  <div class="card"><div style="font-size:.82rem;font-weight:700;margin-bottom:10px;">⚠️ Alertas</div>
  ${novs.length?novs.map(n=>`<div class="nov">${n}</div>`).join(''):'<div style="color:var(--td);text-align:center;padding:20px;">✅ Sin novedades esta semana</div>'}</div>`;
}

function calcProp(){
  const el=$('prop-total');if(!el)return;
  const total=+el.value||0;
  if(total===0){$('prop-result').innerHTML=`<div style="text-align:center;color:var(--mu);font-size:.8rem;padding:20px;">Ingresa el total de propinas para calcular</div>`;return;}
  const sessanio=total*0.2,repartir=total*0.8;
  const sch=curSch();const se=sortedE();
  let totalH=0;se.forEach(e=>{(sch[e.name]||[]).forEach(s=>totalH+=ch(s));});
  let rows='';
  se.forEach(emp=>{
    let eh=0;(sch[emp.name]||[]).forEach(s=>eh+=ch(s));
    const pct=totalH>0?(eh/totalH):0,monto=repartir*pct;
    rows+=`<div class="nr"><div style="display:flex;align-items:center;gap:8px;">
      <div class="av" style="background:${emp.color};width:26px;height:26px;font-size:.68rem;">${emp.name[0]}</div>
      <div><div class="nl">${emp.name}</div><div class="ns">${eh.toFixed(0)}h · ${(pct*100).toFixed(1)}%</div></div>
    </div><div class="nv">${f$(monto)}</div></div>`;
  });
  $('prop-result').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
      <div class="st go" style="border-radius:10px;"><div class="n" style="font-size:1.1rem;">${f$(sessanio)}</div><div class="l">20% Sessanio</div></div>
      <div class="st" style="border-radius:10px;"><div class="n" style="font-size:1.1rem;">${f$(repartir)}</div><div class="l">80% Empleados</div></div>
    </div>

    ${rows}
    <div class="ntot" style="margin-top:10px;"><span>Total repartido</span><span class="t">${f$(repartir)}</span></div>`;
}

// ── EMP MODAL ──
function openEmpModal(id){
  selR=[];
  document.querySelectorAll('.role-btn').forEach(b=>b.style.border='1px solid transparent');
  if(id!=null){
    const e=E.find(x=>x.id===id);if(!e)return;
    $('moet').textContent='✏️ '+e.name;$('efid').value=id;$('efname').value=e.name;
    $('eftipo').value=e.tipo||'fijo';$('efsal').value=e.sal||SMMLV;$('efvh').value=e.vh||6000;
    $('efpref').value=e.pref||'Flexible';$('efnotes').value=e.notes||'';
    toggleTipo();
    selR=[...(e.roles||[])];
    selR.forEach(r=>{const b=document.querySelector('.role-btn[data-r="'+r+'"]');if(b)b.style.border='2px solid var(--td)';});
    $('del-emp-btn').style.display='block';
  }else{
    $('moet').textContent='👤 Nuevo colaborador';$('efid').value='';$('efname').value='';
    $('eftipo').value='fijo';$('efsal').value=SMMLV;$('efvh').value=6000;$('efpref').value='Flexible';$('efnotes').value='';
    toggleTipo();$('del-emp-btn').style.display='none';
  }
  om('mo-emp');
}
function saveEmp(){
  const name=$('efname').value.trim();if(!name){toast('⚠️ Nombre obligatorio');return;}
  if(!selR.length){toast('⚠️ Selecciona al menos un rol');return;}
  const id=$('efid').value,tipo=$('eftipo').value,sal=+$('efsal').value||SMMLV,vh=+$('efvh').value||6000,pref=$('efpref').value,notes=$('efnotes').value.trim();
  if(id){
    const e=E.find(x=>x.id===id);if(!e)return;const old=e.name;
    Object.assign(e,{name,roles:[...selR],tipo,sal,vh,pref,notes});
    if(old!==name){Object.keys(schedules).forEach(k=>{if(schedules[k][old]){schedules[k][name]=schedules[k][old];delete schedules[k][old];fbSaveSch(k);}});}
    fbSaveEmp(e);toast('✅ '+name+' actualizado');
  }else{
    const nc={id:String(Date.now()),name,roles:[...selR],tipo,sal,vh,pref,notes,color:COLORS[E.length%COLORS.length],order:E.length};
    E.push(nc);Object.keys(schedules).forEach(k=>{schedules[k][name]=Array(7).fill('-');});
    fbSaveEmp(nc);toast('✅ '+name+' agregado');
  }
  cm('mo-emp');rc();
}

// ── EVENT LISTENERS FIJOS ──
document.getElementById('tabs').addEventListener('click',e=>{
  const tab=e.target.closest('.tab');if(tab)gv(+tab.dataset.tab);
});
$('close-picker').addEventListener('click',()=>cm('picker'));
$('apply-custom').addEventListener('click',()=>{
  const e=$('pke').value,s=$('pks').value;
  if(!e||!s){toast('⚠️ Ingresa entrada y salida');return;}
  if(pt(e)>=pt(s)){toast('⚠️ Salida debe ser mayor');return;}
  applyShift(e+'-'+s);
});
$('close-mo-emp').addEventListener('click',()=>cm('mo-emp'));
$('close-mo-nom').addEventListener('click',()=>cm('mo-nom'));
$('close-mo-copy').addEventListener('click',()=>cm('mo-copy'));
$('cfm-cancel').addEventListener('click',()=>cm('cfm'));
$('save-emp-btn').addEventListener('click',saveEmp);
$('del-emp-btn').addEventListener('click',()=>{
  const id=$('efid').value;if(!id)return;
  const e=E.find(x=>x.id===id);if(!e)return;
  delId=id;$('cfmmsg').textContent='Se eliminará a "'+e.name+'" y todos sus turnos.';om('cfm');
});
$('cfm-confirm').addEventListener('click',()=>{
  if(!delId){cm('cfm');return;}const e=E.find(x=>x.id===delId);if(!e){cm('cfm');return;}
  const n=e.name;
  Object.keys(schedules).forEach(k=>{delete schedules[k][n];fbSaveSch(k);});
  fbDelEmp(delId);
  E=E.filter(x=>x.id!==delId);delId=null;cm('cfm');cm('mo-emp');rc();toast('🗑 '+n+' eliminado');
});
$('eftipo').addEventListener('change',toggleTipo);
document.querySelectorAll('.role-btn').forEach(btn=>btn.addEventListener('click',()=>{
  const r=btn.dataset.r,i=selR.indexOf(r);
  if(i>=0){selR.splice(i,1);btn.style.border='1px solid transparent';}
  else{selR.push(r);btn.style.border='2px solid var(--td)';}
}));
$('copy-wk-minus').addEventListener('click',()=>{copyWkOff--;if(copyWkOff===0)copyWkOff--;updateCopyLbl();});
$('copy-wk-plus').addEventListener('click',()=>{copyWkOff++;if(copyWkOff===0)copyWkOff++;updateCopyLbl();});
$('do-copy-btn').addEventListener('click',()=>{
  const srcKey=wkKey(0);const dstKey=wkKey(copyWkOff);
  const src=schedules[srcKey];if(!src){toast('⚠️ Esta semana no tiene horario');return;}
  schedules[dstKey]=JSON.parse(JSON.stringify(src));
  fbSaveSch(dstKey);cm('mo-copy');toast('📋 Horario copiado a '+wlabel(copyWkOff));
});
document.querySelectorAll('.mo,.picker,.cfm').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on');}));

// ── INIT ──
tick();setInterval(tick,60000);
fbInit();
</script>
</body>
</html>
